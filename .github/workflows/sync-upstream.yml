# The downstream main is a product branch, not an Alibaba mirror.
# Preserve mp0rta/mqvpn-main history in a draft PR; never update main here.
name: Propose upstream mqvpn-main sync

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  propose-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout downstream main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Propose missing upstream history
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/mp0rta/xquic.git mqvpn-main
          upstream_sha=$(git rev-parse FETCH_HEAD)
          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "Upstream mqvpn-main is already contained in main."
            exit 0
          fi

          # An existing integration PR may already include this upstream head.
          # Query failures or a concurrently changed head must not look empty.
          open_prs=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100" \
            --jq '.[] | "\(.number) \(.head.sha)"')
          while read -r number head_sha; do
            [ -n "$number" ] || continue
            if ! git cat-file -e "$head_sha^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "refs/pull/$number/head"
              if [ "$(git rev-parse FETCH_HEAD)" != "$head_sha" ]; then
                echo "::error::PR #$number changed while inspecting its history."
                exit 1
              fi
            fi
            if git merge-base --is-ancestor "$upstream_sha" "$head_sha"; then
              echo "PR #$number already includes the upstream head."
              exit 0
            fi
          done <<< "$open_prs"

          branch="sync/upstream-${upstream_sha:0:12}"
          remote_sha=$(git ls-remote --heads origin "refs/heads/$branch" \
            | awk '{print $1}')
          if [ -n "$remote_sha" ]; then
            if [ "$remote_sha" != "$upstream_sha" ]; then
              echo "::error::Existing sync branch differs; refusing to overwrite it."
              exit 1
            fi
          else
            git push origin "$upstream_sha:refs/heads/$branch"
          fi

          body_file=$(mktemp)
          trap 'rm -f "$body_file"' EXIT
          cat > "$body_file" <<'BODY'
          ### Mechanism

          Proposes the complete history from mp0rta/xquic:mqvpn-main against
          this fork's custom main. No automatic merge or direct main update.
          Resolve conflicts by retaining upstream implementations and only
          the downstream features that are still needed.

          ### Validation Cases

          Pending maintainer review of the upstream delta and consumer build.

          ### CONTRIBUTING.md

          - Overall: Pending
          - Local regression: Incomplete
          - CI: Pending — run Build and CodeQL for this branch before merge;
            GITHUB_TOKEN-authored events do not normally start other workflows.
          BODY
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --draft --title "chore(sync): synchronize mp0rta mqvpn-main" \
            --body-file "$body_file"
